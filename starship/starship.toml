# ==================================================
# Starship — AURORA COCKPIT
# Dark Glass HUD with controlled Cyan / Violet accents
# ==================================================

add_newline = true

format = """
$directory\
${custom.git_pill}\
$nodejs\
$dart\
$python\
$package\
$status\
$cmd_duration\
$time
$character
"""

[directory]
format = "[](#59E1FF)[󰉋  $path]($style)[](#59E1FF) "
style = "bold bg:#59E1FF fg:#05070D"
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"
read_only_style = "bold #FF6384"

[git_branch]
disabled = true

[git_status]
disabled = true

[custom.git_pill]
command = '"$HOME/.config/aurora/git-pill.zsh"'
when = true
require_repo = true
unsafe_no_escape = true
format = "$output "
description = "AURORA Git status pill"

[nodejs]
symbol = " "
format = "[$symbol](bold #8FF0A4)[$version](#8FF0A4) "
detect_extensions = ["js", "mjs", "cjs", "ts", "mts", "cts", "tsx", "jsx"]
detect_files = ["package.json", ".node-version"]

[dart]
symbol = " "
format = "[$symbol](bold #59E1FF)[$version](#59E1FF) "

[python]
symbol = " "
format = '[$symbol($version )(\($virtualenv\) )](bold #6C9DFF)'

[package]
symbol = "󰏗 "
format = "[$symbol](bold #FFD166)[$version](#FFD166) "

[status]
disabled = false
symbol = "✕ "
not_executable_symbol = "NOEXEC "
not_found_symbol = "NOTFOUND "
sigint_symbol = "INT "
signal_symbol = "SIG "
map_symbol = true
format = "[$symbol$status](bold #FF6384) "

[cmd_duration]
min_time = 1500
format = "[󰔛 ](bold #FFD166)[$duration](#FFD166) "

[time]
disabled = false
time_format = "%H:%M:%S"
format = "[ ](bold #FFD166)[$time](#FFD166)"

[character]
success_symbol = "[╰─](#5F6E86)[ ✦ ❯](bold #59E1FF)"
error_symbol = "[╰─](#5F6E86)[ ✦ ❯](bold #FF6384)"
vimcmd_symbol = "[╰─](#5F6E86)[ ❮](bold #BE8CFF)"

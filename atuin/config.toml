# AURORA Atuin history UI.
# History remains local unless the user explicitly opts into sync.

style = "compact"
inline_height = 20
enter_accept = false
workspaces = true
filter_mode = "workspace"
search_mode = "fuzzy"

auto_sync = false
secrets_filter = true

[search]
filters = ["workspace", "directory", "session", "host", "global"]
